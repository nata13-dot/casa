; /etc/php/8.2/fpm/pool.d/casa.conf
;
; Pool propio para Casa: corre con su usuario de sistema "casa" y solo puede
; leer su carpeta. Si alguien encontrara una falla en esta app, no podría leer
; archivos ni configuraciones de los otros sistemas del servidor.
;
; Crear el usuario:  sudo adduser --system --group --no-create-home casa
; Aplicar:           sudo systemctl reload php8.2-fpm

[casa]
user = casa
group = casa

listen = /run/php/php8.2-fpm-casa.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: sin procesos en reposo → casi 0 MB de RAM cuando nadie usa la app.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Solo puede tocar su propio código, la llave de Firebase y /tmp (subidas).
php_admin_value[open_basedir] = /var/www/casa/api:/etc/casa:/tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp

; La app no ejecuta comandos del sistema: se prohíbe por completo.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 30
php_admin_flag[allow_url_fopen] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/casa/php-error.log

security.limit_extensions = .php
