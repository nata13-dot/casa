# /etc/nginx/sites-available/casa  →  ln -s ../sites-available/casa /etc/nginx/sites-enabled/
#
# Escucha solo en localhost: el acceso público llega por Cloudflare Tunnel
# (cloudflared → http://127.0.0.1:8085). Cambia el puerto si ya está ocupado.

server {
    listen 127.0.0.1:8085;
    server_name casa.tudominio.com;

    root /var/www/casa/api/public;

    # No revelar versión de Nginx (también conviene ponerlo en el bloque http de nginx.conf).
    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;
    index index.php;

    # Las fotos llegan ya reducidas desde la app (~200-400 KB), 8M da margen.
    client_max_body_size 8M;

    # Fotos de los perros: archivos estáticos con nombre aleatorio.
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        # Nunca ejecutar nada subido.
        location ~ \.php$ { deny all; }
    }

    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        # Pool aislado de Casa (deploy/php-fpm-casa.conf).
        fastcgi_pass unix:/run/php/php8.2-fpm-casa.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 30s;
    }

    # Todo lo demás (.env, src/, storage/ no están bajo public/, pero por si acaso):
    location ~ /\. { deny all; }
    location / { return 404; }
}
